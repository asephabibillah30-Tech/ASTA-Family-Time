<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="50%" stop-color="#FF85A1" />
      <stop offset="100%" stop-color="#9B5DE5" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF9EB" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="16 16" opacity="0.4" />

  <!-- Shadow Card Deck 1 -->
  <rect x="130" y="100" width="220" height="290" rx="36" fill="#FFD166" transform="rotate(-10 240 245)" filter="url(#shadow)" opacity="0.9" />

  <!-- Shadow Card Deck 2 -->
  <rect x="150" y="100" width="220" height="290" rx="36" fill="#4ECDC4" transform="rotate(8 260 245)" filter="url(#shadow)" opacity="0.9" />

  <!-- Main Central Card -->
  <rect x="146" y="105" width="220" height="290" rx="36" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="8" filter="url(#shadow)" />

  <!-- Card Header Ribbon -->
  <path d="M 154 145 Q 256 160 358 145 L 358 113 Q 358 113 350 113 L 162 113 Q 154 113 154 121 Z" fill="#FF6B6B" />

  <!-- Central Emoji Icon -->
  <text x="256" y="270" font-size="100" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif">🎴</text>

  <!-- Stars and Hearts -->
  <text x="180" y="340" font-size="34" text-anchor="middle" dominant-baseline="middle">⭐</text>
  <text x="256" y="355" font-size="40" text-anchor="middle" dominant-baseline="middle">❤️</text>
  <text x="330" y="340" font-size="34" text-anchor="middle" dominant-baseline="middle">✨</text>

  <!-- App Brand Text -->
  <text x="256" y="445" font-size="36" font-weight="900" text-anchor="middle" fill="#FFFFFF" font-family="'Fredoka', 'Plus Jakarta Sans', sans-serif" letter-spacing="2">ASTA FAMILY</text>
</svg>
